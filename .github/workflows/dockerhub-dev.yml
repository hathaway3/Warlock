name: Docker Hub Dev Release

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so the commit count below is stable and monotonic
          fetch-depth: 0

      - name: Compute dev version
        id: version
        run: |
          BASE=$(node -p "require('./package.json').version")
          COUNT=$(git rev-list --count HEAD)
          echo "dev=${BASE}-dev.${COUNT}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/warlock:dev
            ${{ secrets.DOCKERHUB_USERNAME }}/warlock:${{ steps.version.outputs.dev }}
