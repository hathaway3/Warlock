name: Sync Main to Release Branch

on:
  push:
    tags:
      - 'v*' # Triggers on any tag starting with 'v'

jobs:
  merge-main-to-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to push changes back to the repo
      pull-requests: write # Required to create pull requests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Full history for all branches/tags is required for the merge-base ancestor
          # checks below — a shallow checkout would make branch detection unreliable.
          fetch-depth: 0

      - name: Set up Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Determine Source and Target Branches
        run: |
          # github.ref_name gives us the tag (e.g., 'v1.2.3')
          TAG_NAME="${{ github.ref_name }}"
          
          # Use 'cut' to grab the first two fields separated by a dot (e.g., 'v1.2')
          VERSION_PREFIX=$(echo $TAG_NAME | cut -d'.' -f1,2)
          
          # Construct the target branch name
          TARGET_BRANCH="release-$VERSION_PREFIX"
          
          # Get the commit hash that the tag points to
          COMMIT_HASH=$(git rev-parse $TAG_NAME)

          # Determine the source branch deterministically instead of picking an arbitrary
          # entry from `git branch --contains` (whose output order isn't meaningful and
          # could name an unrelated feature branch that happens to contain the commit).
          # A release tag's commit is expected to be on `main` (the normal case) or,
          # when cutting a patch directly on an already-existing release branch, on that
          # release branch — check in that priority order.
          if git merge-base --is-ancestor "$COMMIT_HASH" origin/main; then
            SOURCE_BRANCH="main"
          elif git ls-remote --exit-code --heads origin "$TARGET_BRANCH" >/dev/null 2>&1 && \
               git merge-base --is-ancestor "$COMMIT_HASH" "origin/$TARGET_BRANCH"; then
            SOURCE_BRANCH="$TARGET_BRANCH"
          else
            # Fallback to main if the commit isn't reachable from either (safety net)
            SOURCE_BRANCH="main"
          fi
          
          echo "Detected Tag: $TAG_NAME"
          echo "Detected Source Branch: $SOURCE_BRANCH"
          echo "Target Release Branch: $TARGET_BRANCH"
          
          # Save both to GITHUB_ENV
          echo "TARGET_BRANCH=$TARGET_BRANCH" >> $GITHUB_ENV
          echo "SOURCE_BRANCH=$SOURCE_BRANCH" >> $GITHUB_ENV

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch origin
          
          # Check if this branch exists in the first place.
          if ! git ls-remote --heads origin "$TARGET_BRANCH"; then
            echo "Target branch $TARGET_BRANCH does not exist. Creating it from $SOURCE_BRANCH..."
            git checkout -b "$TARGET_BRANCH" "origin/$SOURCE_BRANCH"
            git push origin "$TARGET_BRANCH"
          else
            # Create a pull request from the source branch to the target branch
            gh pr create \
              --base $TARGET_BRANCH \
              --head $SOURCE_BRANCH \
              --title "Merge $SOURCE_BRANCH into $TARGET_BRANCH" \
              --body "Automated pull request to sync changes from $SOURCE_BRANCH to $TARGET_BRANCH"
          fi
